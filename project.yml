name: FrodiVit
options:
  bundleIdPrefix: com.Tazk
  deploymentTarget:
    iOS: "26.5"
  xcodeVersion: "26.6"
  developmentLanguage: nb
  generateEmptyDirectories: true
settings:
  base:
    # Language mode, not toolchain version. Valid values: 4, 4.2, 5, 6.
    SWIFT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: FrodiVit/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.Tazk.FrodiVit
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  # Apples egen Swift-pakke for MLX. MIT.
  #
  # Bare tre produkter kobles inn. MLXHuggingFace, som ligger i samme pakke,
  # kobles bevisst ikke inn: det er den eneste veien MLX har ut på nettet, og
  # en pakke som ikke er lenket kan ikke kalles ved et uhell. Modellene lastes
  # fra en lokal mappe.
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: "3.31.4"
  # Tokenizeren. MLX leverer ingen: MLXLMCommon definerer bare protokollen
  # `Tokenizer`, og den eneste implementasjonen i pakken er en no-op til
  # ytelsestesting. Den ekte veien går gjennom MLXHuggingFace, som er
  # makroer som utvider seg til Hugging Face-hubben — altså nett.
  #
  # Vi tar tokenizeren herfra i stedet og skriver broen selv, i
  # `LocalTokenizer`. Da leses tokenizer.json fra mappen i app-pakken, og
  # ingen hub-kode kommer inn i bygget. Apache 2.0.
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: "1.3.4"
targets:
  FrodiVit:
    type: application
    platform: iOS
    sources:
      - path: FrodiVit
        excludes:
          - "**/.DS_Store"
          # Språkmodellen legges til som mappereferanse under resources når den
          # kommer. Uten denne ekskluderingen fanger sources den opp i tillegg,
          # og config.json-filene kolliderer i app-pakken. Samme felle som i
          # Fróði røst, løst på samme måte.
          - "Resources/Model"
      # Mappereferanse, ikke enkeltfiler. Beholder katalogstrukturen, som
      # tokenizeren og vektene leses ut fra, og hindrer at config.json-filene
      # kolliderer i bunnen av app-pakken. Må stå under sources med
      # buildPhase: resources — en oppføring under `resources:` tar ikke
      # `type: folder`, og da havner ingenting i pakken.
      - path: FrodiVit/Resources/Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXEmbedders
      - package: Transformers
        product: Tokenizers
    resources:
      - path: FrodiVit/Resources/Assets.xcassets
      - path: FrodiVit/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 8NW62A7PRA
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: FrodiVit/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Fróði vit"
        CFBundleLocalizations:
          - nb
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Skranji-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Ingen UIBackgroundModes. Denne appen gjør ingenting i bakgrunnen, og
        # en tom liste er lettere å forsvare enn en med én ting i. En test
        # vokter at nøkkelen holder seg borte.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAccessibilityPerformEscapeEnabled: true
  FrodiVitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrodiVitTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FrodiVit
  FrodiVitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrodiVitUITests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FrodiVit
schemes:
  FrodiVit:
    build:
      targets:
        FrodiVit: all
    run:
      config: Debug
    test:
      targets:
        - FrodiVitTests
        - FrodiVitUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
