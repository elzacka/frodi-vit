name: FrodiVit
options:
  bundleIdPrefix: com.Tazk
  deploymentTarget:
    iOS: "26.5"
  xcodeVersion: "26.6"
  developmentLanguage: nb
  generateEmptyDirectories: true
settings:
  base:
    # Language mode, not toolchain version. Valid values: 4, 4.2, 5, 6.
    SWIFT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: FrodiVit/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.Tazk.FrodiVit
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  # Apple's own Swift package for MLX. MIT.
  #
  # Only three products are linked. MLXHuggingFace, in the same package, is
  # deliberately not: it is the only route MLX has to the network, and a
  # package that is not linked cannot be called by accident. The models are
  # loaded from a local folder.
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: "3.31.4"
  # The tokenizer. MLX ships none: MLXLMCommon only defines the `Tokenizer`
  # protocol, and the only implementation in the package is a no-op for
  # performance testing. The real route goes through MLXHuggingFace, which is
  # macros that expand to the Hugging Face hub, that is, the network.
  #
  # We take the tokenizer from here instead and write the bridge ourselves, in
  # `LocalTokenizer`. tokenizer.json is then read from the folder in the app
  # bundle, and no hub code enters the build. Apache 2.0.
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: "1.3.4"
targets:
  FrodiVit:
    type: application
    platform: iOS
    sources:
      - path: FrodiVit
        excludes:
          - "**/.DS_Store"
          # The language model is added as a folder reference under resources when it
          # arrives. Without this exclusion, sources picks it up as well, and the
          # config.json files collide in the app bundle. Same trap as in Fróði røst,
          # solved the same way.
          - "Resources/Model"
      # A folder reference, not individual files. Keeps the directory structure the
      # tokenizer and weights are read from, and prevents the config.json files from
      # colliding at the root of the app bundle. Must sit under sources with
      # buildPhase: resources; an entry under `resources:` does not take
      # `type: folder`, and then nothing lands in the bundle.
      - path: FrodiVit/Resources/Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLXLM
        product: MLXEmbedders
      - package: Transformers
        product: Tokenizers
    resources:
      - path: FrodiVit/Resources/Assets.xcassets
      - path: FrodiVit/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 8NW62A7PRA
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: FrodiVit/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Fróði vit"
        CFBundleLocalizations:
          - nb
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Skranji-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # No UIBackgroundModes. This app does nothing in the background, and an
        # empty list is easier to defend than one with a single entry. A test guards
        # that the key stays away.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAccessibilityPerformEscapeEnabled: true
  FrodiVitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrodiVitTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FrodiVit
  FrodiVitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrodiVitUITests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FrodiVit
schemes:
  FrodiVit:
    build:
      targets:
        FrodiVit: all
    run:
      config: Debug
    test:
      targets:
        - FrodiVitTests
        - FrodiVitUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
